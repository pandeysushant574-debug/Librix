<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Bounds Testing — Librix</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar-mount"></nav>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="datetime-chip" id="topbar-clock"></div>
        <div><div class="page-title">Input Bounds Testing</div><div class="page-subtitle">Boundary-value checks: below / lower / normal / upper / above</div></div>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="logout-btn" title="Log out">⏻</button>
        <div class="user-chip" id="user-chip"></div>
      </div>
    </header>
    <main class="content">
      <div class="glass-panel">
        <div class="section-header">
          <h2>📐 Boundary Test Matrix</h2>
          <div class="section-actions"><button class="btn btn-primary" id="run-boundary-btn">▶ Run All Boundary Tests</button></div>
        </div>
        <div class="table-wrap glass">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>Code</th><th>Module</th><th>Field</th><th>Expected Behavior</th><th>Actual Behavior</th><th>Status</th><th>Executed At</th></tr>
              </thead>
              <tbody id="boundary-tbody"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/transitions.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/input-bounds.js"></script>
</body>
</html>
