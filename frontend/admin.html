<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Librix</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar-mount"></nav>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="datetime-chip" id="topbar-clock"></div>
        <div><div class="page-title">Admin</div><div class="page-subtitle">User &amp; role management (Admin only)</div></div>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="logout-btn" title="Log out">⏻</button>
        <div class="user-chip" id="user-chip"></div>
      </div>
    </header>
    <main class="content">
      <div class="glass-panel">
        <div class="section-header">
          <h2>🛡️ Users</h2>
          <div class="section-actions"><button class="btn btn-primary" id="add-user-btn">+ Add User</button></div>
        </div>
        <div class="table-wrap glass">
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Email</th><th>Created</th><th>Actions</th></tr></thead>
              <tbody id="users-tbody"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="glass-panel" style="margin-top:18px;">
        <div class="section-header"><h2>Role Permissions</h2></div>
        <div class="form-grid">
          <div class="field"><label>ADMIN</label><div style="color:var(--text-secondary);font-size:13px;">All modules</div></div>
          <div class="field"><label>LIBRARIAN</label><div style="color:var(--text-secondary);font-size:13px;">Books, Members, Issue/Return, Search, Reports, Quality</div></div>
          <div class="field"><label>ASSISTANT</label><div style="color:var(--text-secondary);font-size:13px;">Search, Issue/Return, limited Reports</div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/transitions.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
