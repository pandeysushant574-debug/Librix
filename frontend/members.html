<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members — Librix</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar-mount"></nav>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="datetime-chip" id="topbar-clock"></div>
        <div><div class="page-title">Members</div><div class="page-subtitle">Library membership management</div></div>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="logout-btn" title="Log out">⏻</button>
        <div class="user-chip" id="user-chip"></div>
      </div>
    </header>
    <main class="content">
      <div class="glass-panel">
        <div class="section-header">
          <h2>🧑‍🤝‍🧑 Members</h2>
          <div class="section-actions">
            <button class="btn btn-primary" id="add-member-btn">+ Add Member</button>
            <button class="btn" id="export-members-btn">⬇ Export CSV</button>
          </div>
        </div>
        <div class="table-toolbar">
          <div class="search-box">🔎<input type="text" id="member-search" placeholder="Search by name, code, email…"></div>
          <select class="filter-select" id="member-status-filter">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <div class="table-wrap glass">
          <div class="table-scroll">
            <table class="data-table" id="members-table">
              <thead>
                <tr>
                  <th data-key="member_code">Code</th>
                  <th data-key="name">Name</th>
                  <th data-key="email">Email</th>
                  <th data-key="phone">Phone</th>
                  <th data-key="membership_date">Since</th>
                  <th data-key="status">Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="members-tbody"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="pagination" id="members-pagination"></div>
      </div>
    </main>
  </div>
</div>
<script src="js/transitions.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/members.js"></script>
</body>
</html>
