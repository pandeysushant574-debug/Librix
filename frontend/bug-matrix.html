<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Matrix — Librix</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar-mount"></nav>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="datetime-chip" id="topbar-clock"></div>
        <div><div class="page-title">Bug Log Matrix</div><div class="page-subtitle">Open → In Progress → Fixed → Retest → Closed</div></div>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="logout-btn" title="Log out">⏻</button>
        <div class="user-chip" id="user-chip"></div>
      </div>
    </header>
    <main class="content">
      <div class="kpi-grid" id="bug-counters"></div>

      <div class="glass-panel">
        <div class="section-header">
          <h2>🐞 Bugs</h2>
          <div class="section-actions">
            <button class="btn btn-primary" id="add-bug-btn">+ Log Bug</button>
            <button class="btn" id="export-bugs-btn">⬇ Export</button>
          </div>
        </div>
        <div class="table-toolbar">
          <select class="filter-select" id="bug-status-filter">
            <option value="">All Statuses</option>
            <option>Open</option><option>In Progress</option><option>Fixed</option><option>Retest</option><option>Closed</option>
          </select>
          <select class="filter-select" id="bug-severity-filter">
            <option value="">All Severities</option>
            <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
          </select>
        </div>
        <div class="table-wrap glass">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>Code</th><th>Date</th><th>Module</th><th>Title</th><th>Severity</th><th>Priority</th><th>Status</th><th>Closed</th><th>Actions</th></tr>
              </thead>
              <tbody id="bugs-tbody"><tr><td colspan="9" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/transitions.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/bug-matrix.js"></script>
</body>
</html>
