<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Test Cases — Librix</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar-mount"></nav>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="datetime-chip" id="topbar-clock"></div>
        <div><div class="page-title">Unit Test Cases</div><div class="page-subtitle">Real Python backend logic execution, results stored in test_results</div></div>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="logout-btn" title="Log out">⏻</button>
        <div class="user-chip" id="user-chip"></div>
      </div>
    </header>
    <main class="content">
      <div class="glass-panel">
        <div class="section-header">
          <h2>🧪 Unit Test Cases</h2>
          <div class="section-actions">
            <button class="btn btn-primary" id="run-all-btn">▶ Run All Tests</button>
            <button class="btn" id="add-test-btn">+ Add</button>
            <button class="btn" id="export-tests-btn">⬇ Export</button>
          </div>
        </div>
        <div class="table-wrap glass">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th><th>Code</th><th>Module</th><th>Title</th><th>Expected</th>
                  <th>Actual</th><th>Status</th><th>Executed At</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="tests-tbody"><tr><td colspan="9" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/transitions.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/unit-tests.js"></script>
</body>
</html>
